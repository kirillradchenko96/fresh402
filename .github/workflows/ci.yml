name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx tsc --noEmit -p test/tsconfig.json
      - run: npm test -- --run
      - run: npx tsc --noEmit -p examples/knowledge-base/tsconfig.json
      - run: node --test examples/knowledge-base/*.test.ts
      - run: node examples/knowledge-base/prepaid-run.ts --demo
