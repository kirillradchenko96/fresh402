name: Customer example
on:
  pull_request:
    paths: ['examples/knowledge-base/**', 'examples/efficiency/**', 'scripts/public-interface-monitor*', '.github/workflows/customer-example.yml']
  push:
    branches: [main]
    paths: ['examples/knowledge-base/**', 'examples/efficiency/**', 'scripts/public-interface-monitor*', '.github/workflows/customer-example.yml']
permissions:
  contents: read
jobs:
  customer-example:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm ci
      - run: node --test examples/knowledge-base/*.test.ts
      - run: node examples/knowledge-base/run.ts --demo
      - run: node examples/knowledge-base/run.ts --demo --mcp
      - run: node --test examples/efficiency/*.test.ts
      - run: npx tsc --noEmit -p examples/efficiency/tsconfig.json
      - run: node --test scripts/public-interface-monitor.test.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix examples/efficiency/adapters/openai
      - run: node --test examples/efficiency/adapters/openai/tools.test.ts
      - run: npx tsc --noEmit -p examples/efficiency/adapters/openai/tsconfig.json
      - run: npm ci --ignore-scripts --no-audit --no-fund --omit=optional --prefix examples/efficiency/adapters/agentkit
      - run: node --test examples/efficiency/adapters/agentkit/provider.test.ts
      - run: npx tsc --noEmit -p examples/efficiency/adapters/agentkit/tsconfig.json
      - run: npm ci --ignore-scripts --no-audit --no-fund --omit=optional --prefix examples/efficiency/adapters/langchain
      - run: node --test examples/efficiency/adapters/langchain/tools.test.ts examples/efficiency/adapters/langchain/demo.test.ts examples/efficiency/adapters/langchain/jobs.test.ts
      - run: npx tsc --noEmit -p examples/efficiency/adapters/langchain/tsconfig.json
