name: Customer example
on:
  pull_request:
    paths: ['examples/knowledge-base/**', '.github/workflows/customer-example.yml']
  push:
    branches: [main]
    paths: ['examples/knowledge-base/**', '.github/workflows/customer-example.yml']
permissions:
  contents: read
jobs:
  customer-example:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: node --test examples/knowledge-base/client.test.ts
      - run: node examples/knowledge-base/run.ts --demo
      - run: node examples/knowledge-base/run.ts --demo --mcp
