name: Publish existing MCP Registry identity
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Reviewed main commit containing this exact production manifest
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: fresh402-existing-registry-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'kirillradchenko96/fresh402' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Verify reviewed production metadata and live public interfaces
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node scripts/validate-registry-metadata.mjs
          node examples/efficiency/read-only-smoke.ts > "$RUNNER_TEMP/fresh402-public-discovery.json"
          node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; const m=JSON.parse(fs.readFileSync("server.json")),d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/fresh402-public-discovery.json")); assert.equal(d.version,m.version); assert.equal(d.restTools,8); assert.equal(d.mcpTools,8); assert.equal(d.newPayments,0);'
      - name: Install signature verification
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify pinned official publisher
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/fresh402-registry"
          cd "$RUNNER_TEMP/fresh402-registry"
          archive=mcp-publisher_linux_amd64.tar.gz
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION"
          curl --fail --location --silent --show-error --max-time 30 --output "$archive" "$base_url/$archive"
          echo "$MCP_PUBLISHER_SHA256  $archive" | sha256sum --check
          curl --fail --location --silent --show-error --max-time 30 --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob --bundle "$archive.sigstore.json" --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/$MCP_PUBLISHER_VERSION" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$archive"
          tar xzf "$archive" mcp-publisher
          ./mcp-publisher validate "$GITHUB_WORKSPACE/server.json"
      - name: Authenticate with short-lived GitHub OIDC and publish this existing identity
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/fresh402-registry"
          # Auth output stays private to the ephemeral runner; no token or PAT is logged.
          ./mcp-publisher login github-oidc --registry=https://registry.modelcontextprotocol.io > "$RUNNER_TEMP/fresh402-registry-auth.log" 2>&1
          ./mcp-publisher publish "$GITHUB_WORKSPACE/server.json"
      - name: Remove ephemeral Registry authentication
        if: always()
        run: |
          if test -x "$RUNNER_TEMP/fresh402-registry/mcp-publisher"; then
            "$RUNNER_TEMP/fresh402-registry/mcp-publisher" logout > /dev/null 2>&1 || true
          fi
